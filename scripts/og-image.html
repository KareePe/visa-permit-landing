<!doctype html>
<!-- OG image template (1200×630), mirrors the hero section.
     Render: npm run build:og  → assets/img/og-image.jpg -->
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400..800&display=block">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { position:relative; font-family:'Noto Sans Thai', sans-serif; background:#1546A0; color:#fff; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:70% center; }
  .shade { position:absolute; inset:0; background:linear-gradient(to right, rgba(21,70,160,.95), rgba(21,70,160,.8) 50%, rgba(21,70,160,.3)); }
  .wrap { position:relative; height:100%; padding:56px 72px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; gap:16px; }
  .logo { background:#fff; border-radius:18px; padding:10px 14px; }
  .logo img { height:44px; display:block; }
  .badge { display:flex; align-items:center; gap:8px; padding:7px 16px 7px 12px; border-radius:999px; background:rgb(255 255 255 / .1); border:1px solid rgb(255 255 255 / .2); font-weight:700; font-size:15px; letter-spacing:.1em; }
  .badge svg { width:18px; height:18px; color:#F7941D; }
  h1 { font-size:58px; line-height:1.24; font-weight:800; max-width:760px; text-wrap:balance; }
  .sub { margin-top:14px; font-size:24px; font-weight:600; color:#A8E6BD; }
  .trust { display:flex; gap:36px; padding-top:24px; border-top:1px solid rgb(255 255 255 / .2); }
  .trust div { display:flex; white-space:nowrap; align-items:center; gap:10px; font-size:18px; font-weight:600; }
  .trust span { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:999px; background:rgb(255 255 255 / .15); }
  .trust svg { width:18px; height:18px; }
</style>
</head>
<body>
  <img class="bg" src="../assets/img/bg-banner.webp" alt="">
  <div class="shade"></div>
  <div class="wrap">
    <div class="top">
      <span class="logo"><img src="../assets/img/fdi-logo.webp" alt=""></span>
      <span class="badge"><i data-lucide="shield-check"></i>FDI GROUP · SINCE 2003</span>
    </div>
    <div>
      <h1>จัดการเรื่องวีซ่าและใบอนุญาตทำงานในไทย ให้เป็นเรื่องง่าย</h1>
      <p class="sub">Visa &amp; Work Permit Services by FDI Accounting &amp; Advisory</p>
    </div>
    <div class="trust">
      <div><span><i data-lucide="award"></i></span>20+ Years Experience</div>
      <div><span><i data-lucide="file-check"></i></span>Document Assistance</div>
      <div><span><i data-lucide="zap"></i></span>Fast Response</div>
      <div><span><i data-lucide="lock"></i></span>Confidential</div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
